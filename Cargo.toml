[package]
name = "chapaty"
version = "1.3.7"
edition = "2024"
authors = ["Len Williamson <lencewa13@gmail.com>"]
description = "An event-driven Rust engine for building and evaluating quantitative trading agents. Features a Gym-style API for algorithmic backtesting and reinforcement learning."
license = "Apache-2.0"
readme = "README.md"
homepage = "https://chapaty.com"
repository = "https://github.com/LenWilliamson/chapaty"
keywords = ["rl", "finance", "gym", "backtesting"]
categories = ["algorithms", "finance", "mathematics", "science", "simulation"]
exclude = ["tests/*", ".cargo", ".github", ".vscode", ".gitignore", "Cargo.lock"]

[dependencies]
async-channel = "2.5"
blake3 = "1.8"
bytes = "1.12"
chrono = "0.4"
chrono-tz = { version = "0.10", features = ["serde"] }
crossbeam = "0.8"
futures = "0.3"
hf-hub = "1.0.0"
humantime = "2.4.0"
indicatif = { version = "0.18", features = ["rayon"] }
itertools = "0.15"
ndarray = "0.17"
object_store = "0.13.2"
ordered-float = { version = "5.5", features = ["serde"] }
polars = { version = "0.55.2", features = [
    "abs",
    "aws",
    "azure",
    "cum_agg",
    "diff",
    "dtype-i128",
    "dynamic_group_by",
    "ewma",
    "gcp",
    "is_in",
    "json",
    "lazy",
    "parquet",
    "polars-io",
    "rolling_window",
    "round_series",
    "strings",
    "temporal",
    "timezones",
] }
postcard = { version = "1.1", features = ["use-std"] }
prost = "0.14"
prost-types = "0.14"
rand = "0.10"
rayon = "1.12"
regex = "1.13"
rust_decimal = "1.43"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = { version = "1.16", features = ["serde"] }
strum = { version = "0.28", features = ["derive"] }
strum_macros = "0.28"
thiserror = "2.0"
tokio = "1.53"
tokio-util = "0.7"
tonic = { version = "0.14", features = ["transport", "tls-ring", "tls-webpki-roots", "tls-native-roots"] }
tonic-prost = "0.14"
tracing = "0.1"

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
anyhow = "1.0"
dirs = "6.0"
time = { version = "0.3", features = ["macros", "formatting"] }
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "time"] }

[lints.rust]
unsafe_code = "forbid"
linker_messages = "allow"
# missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Individually opted-in restriction lints
clone_on_ref_ptr = "warn"
let_underscore_must_use = "warn"
print_stdout = "warn"
print_stderr = "warn"
unwrap_used = "warn"
expect_used = "warn"
future_not_send = "warn"

# Attributes & Code Discipline lints
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
